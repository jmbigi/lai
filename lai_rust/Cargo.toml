[package]
name = "lai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lai"
path = "src/main.rs"

[lib]
name = "lai"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# default-features = false: usa solo rustls, sin OpenSSL ni dependencias de sistema.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "blocking",
    "charset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
walkdir = "2.5"
glob = "0.3"
regex = "1.10"
tempfile = "3.8"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
rusqlite = { version = "0.31", features = ["chrono", "serde_json"] }
once_cell = "1.19"
async-trait = "0.1"
thiserror = "1.0"

tracing = "0.1"
bytes = "1.5"
url = "2.5"
percent-encoding = "2.3"
mime = "0.3"

# lai init wizard dependencies
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"
sysinfo = "0.30"
num_cpus = "1.16"
which = "5.0"
atty = "0.2"
futures-util = { version = "0.3", features = ["sink"] }

# Difference for diff generation
difference = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1