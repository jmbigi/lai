[package]
name = "lai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
walkdir = "2.5"
glob = "0.3"
regex = "1.10"
tempfile = "3.8"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
rusqlite = { version = "0.31", features = ["chrono", "serde_json"] }
indicatif = "0.17"
colored = "2.1"
once_cell = "1.19"
dashmap = "5.5"
async-trait = "0.1"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1.5"
base64 = "0.22"
nix = { version = "0.28", features = ["process"] }
rustls = "0.23"
rustls-pemfile = "1.0"
webpki-roots = "0.25"
rand = "0.8"
url = "2.5"
percent-encoding = "2.3"
mime = "0.3"
mime_guess = "2.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
itertools = "0.12"
async-stream = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.20", features = ["__rustls-tls"] }
tungstenite = { version = "0.20", features = ["__rustls-tls"] }
serde_yaml = "0.9"

# Tree-sitter for structural code analysis
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
# tree-sitter-cpp = "0.23"  # optional
# tree-sitter-c = "0.23"  # optional
# tree-sitter-c-sharp = "0.23"  # not available yet

# File hashing for incremental indexing
blake3 = "1.5"

# Difference for diff generation
difference = "2.0"

# Graph algorithms for planning
petgraph = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1