global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'lai-local'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # lai CLI metrics
  - job_name: 'lai'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: /metrics
    scrape_interval: 10s

  # llama.cpp server
  - job_name: 'llama-cpp'
    static_configs:
      - targets: ['llama-cpp:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  # Gateway
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8081']
    metrics_path: /metrics
    scrape_interval: 10s

  # Langfuse
  - job_name: 'langfuse'
    static_configs:
      - targets: ['langfuse:3000']
    metrics_path: /api/public/metrics
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter for host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # Cadvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']