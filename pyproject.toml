[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["lai", "lai_tools", "lai_automode"]

[project]
name = "lai"
version = "0.0.2"
description = "Local AI Code Assistant - CLI tool for reviewing, repairing, and improving code using local LLMs"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "kubuntu", email = "kubuntu@example.com"}
]
maintainers = [
    {name = "kubuntu", email = "kubuntu@example.com"}
]
keywords = ["ai", "llm", "local", "code-assistant", "cli", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]
[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "radon>=6.0.0",
    "pyflakes>=3.1.0",
    "vulture>=2.10.0",
    "bandit>=1.7.0",
]
quality = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "radon>=6.0.0",
    "pyflakes>=3.1.0",
    "vulture>=2.10.0",
    "bandit>=1.7.0",
]

[project.scripts]
lai = "lai:cli"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "SIM", "TID", "FA", "ISC"]
ignore = ["E501", "B008", "C901"]
fixable = ["F401", "F541", "F841"]
unsafe-fixes = false
src = ["."]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".venv",
    "venv",
    "env",
    "test_todo_project",
    ".crush",
    "logs",
    "sessions",
    "chess",
    "gateway-go",
    "scripts",
    "DOCS",
    "node_modules",
    "dist",
    "build",
    "*.egg-info",
    "rate_limiter_lai.py",
    "todo_api.py",
    "harness.py",
    "gateway.py",
    "generate_chess_direct.py",
    "generate_chess_chunks.py",
    "hola.py",
    "racing.py",
    # Salidas de demostración de `lai code`/`lai auto` y demos heredadas:
    # no son código del producto (calc.py contiene C++ en un .py, por ejemplo).
    "lai_rust/calc.py",
    "lai_rust/test_new.py",
    "lai_rust/test_hello.py",
    "lai_rust/test_factorial.py",
    "test_project",
    "lai_fixed.py",
    "fastapi_server.py",
    "lai_self_improve.py",
]

[tool.ruff.lint.per-file-ignores]
"lai.py" = ["B008", "C901", "T201", "ARG001", "ARG002", "PTH118", "PTH110", "PTH123", "PTH103", "PTH120", "PTH100", "PTH112", "PTH107", "PTH111", "PTH109", "PTH113", "PTH114", "PTH119", "PTH207", "PTH208", "PTH108", "SIM105", "SIM102", "SIM114", "PLW1510", "PLW2901", "PLW0603", "PLW0108", "W293", "W291", "PLR0915", "PLR0912", "PLR0913", "PLR0911", "PLR2004", "PLR5501", "PLC0415", "PLC0207", "W292", "UP006", "UP007", "UP012", "UP035", "UP045", "UP024", "UP015", "UP006", "B007", "TRY300", "W291"]
"lai_tools.py" = ["B008", "C901", "T201", "ARG001", "ARG002", "PTH118", "PTH110", "PTH123", "PTH103", "PTH120", "PTH100", "PTH112", "PTH107", "PTH111", "PTH109", "PTH113", "PTH114", "PTH119", "PTH207", "PTH208", "PTH108", "PTH204", "SIM105", "SIM102", "SIM114", "PLW1510", "PLW2901", "PLW0603", "PLW0108", "W293", "W291", "PLR0915", "PLR0912", "PLR0913", "PLR0911", "PLR2004", "PLR5501", "PLC0415", "PLC0207", "W292", "UP006", "UP007", "UP012", "UP035", "UP045", "UP024", "UP015", "B007", "TRY300", "W291"]
"lai_automode.py" = ["T201", "ARG001", "ARG002", "SIM105", "PLW1510", "PLW2901", "PLW0603", "W293", "W291", "PLR0915", "PLR0912", "PLR0913", "PLR0911", "PLR2004", "PLR5501", "PLC0415", "PLC0207", "W292", "UP006", "UP007", "UP012", "UP035", "UP045", "UP024", "UP015", "B007", "TRY300", "W291"]
"tests/*" = ["S101", "S106", "S113", "T201", "ARG001", "PTH123", "PTH118", "PTH103", "PTH120", "PTH100", "PTH109", "PLC0415", "PLW1510", "W292", "I001", "F401", "PLR2004", "PLR0913"]
"tests/**" = ["S101", "S106", "S113", "T201", "ARG001", "PTH123", "PTH118", "PTH103", "PTH120", "PTH100", "PTH109", "PLC0415", "PLW1510", "W292", "I001", "F401", "PLR2004", "PLR0913"]
# El harness SWE-bench son scripts de línea de comandos: `print` es la salida,
# los imports diferidos evitan coste de arranque y los umbrales numéricos son
# parte del protocolo del benchmark.
"swebench/*" = ["T201", "PLW2901", "PLR2004", "PLC0415", "PLW1510", "SIM105", "SIM102", "SIM114", "SIM117", "SIM113", "PLR0912", "PLR0915", "PLR0913", "PLR0911", "TRY003", "ERA001"]
"swebench/**" = ["T201", "PLW2901", "PLR2004", "PLC0415", "PLW1510", "SIM105", "SIM102", "SIM114", "SIM117", "SIM113", "PLR0912", "PLR0915", "PLR0913", "PLR0911", "TRY003", "ERA001"]
"fib.py" = ["PLR2004", "W292"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
strict = false
disable_error_code = [
    "no-any-return",
    "arg-type",
    "call-overload",
    "assignment",
    "attr-defined",
    "return-value",
    "index",
    "var-annotated",
]
files = ["lai.py", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["__pycache__", ".git", ".venv", "venv", "env"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", "*/site-packages/*"]

[tool.bandit]
exclude_dirs = [".git", "__pycache__", ".pytest_cache", ".ruff_cache", ".mypy_cache", ".venv", "venv", "env", "test_todo_project", ".crush", "logs", "sessions", "chess", "gateway-go", "scripts", "DOCS", "node_modules", "dist", "build", "*.egg-info"]
skip = ["B603", "B607", "B108", "B110", "B404"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]