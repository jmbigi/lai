# Pre-commit configuration for lai
# 100% local: hooks tipo 'local:' no requieren repos remotos ni cuentas de GitHub/GitLab.
# Instalación: pre-commit install
# Ejecución manual: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        files: \.py$
        args: [lai.py, tests/]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        files: \.py$
        args: [lai.py, tests/]

      - id: black
        name: black
        entry: black
        language: system
        files: \.py$
        args: [lai.py, tests/]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        files: \.py$
        args: [lai.py, tests/]

      - id: bandit
        name: bandit
        entry: bandit
        language: system
        files: \.py$
        args: [-q, lai.py]

      - id: radon-cc
        name: radon-cc
        entry: radon
        language: system
        files: \.py$
        args: [cc, -a, -n, B, lai.py]

      - id: vulture
        name: vulture
        entry: vulture
        language: system
        files: \.py$
        args: [lai.py, --min-confidence, 90]

      # Rust es la implementación principal: también pasa por pre-commit.
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -c 'cd lai_rust && cargo fmt --check'
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd lai_rust && cargo clippy --all-targets -- -D warnings'
        language: system
        files: \.rs$
        pass_filenames: false

ci:
  autofix_prs: false
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: quarterly
