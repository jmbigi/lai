# Gateway Go Configuration
version: "3.1.0"
server:
  host: "127.0.0.1"
  port: 8081
  read_timeout: 30s
  write_timeout: 300s
  idle_timeout: 120s
  max_request_size: 52428800  # 50MB

upstream:
  ollama:
    url: "http://127.0.0.1:11434"
    weight: 100
    timeout: 300s
    max_connections: 50
  llama_cpp:
    url: "http://127.0.0.1:8080"
    weight: 0
    timeout: 300s
    max_connections: 100

context:
  max_tokens: 32768
  max_output_tokens: 4096
  compression_threshold: 1024
  preserve_code_blocks: true

cache:
  enabled: true
  max_entries: 5000
  ttl: 1h
  max_key_size: 1024

filter:
  enabled: true
  keywords:
    - "TaskOutput"
    - "TaskStop"
    - "TodoList"
    - "UpdateGoal"
    - "WaitFor"
    - "auto permission mode"
    - "Never Ask"
    - "Plan mode"
    - "system reminder"
    - "Kimi K3.1 Pro"
    - "session_"
    - "Permission mode:"
    - "Everything runs"
    - "only plans in Plan mode"
    - "Switched to"
    - "thinking on"
    - "thinking off"
    - "crush"
    - "Crush"
    - "charm.land"
    - "catwalk"
    - "fang"
    - "bubbletea"
    - "lipgloss"
    - "glamour"
    - "tone"
    - "ultraviolet"
    - "x/ansi"
    - "opencode"
    - "OpenCode"
    - "Nemotron"
    - "nvidia"
    - "system_prompt"
    - "system_prompt:"
    - "<|system|>"
    - "<|user|>"
    - "<|assistant|>"

metrics:
  enabled: true
  path: "/metrics"

logging:
  level: "info"
  format: "json"
  access_log: true

compression:
  enabled: true
  threshold: 1024
  preserve_code_blocks: true
  min_compression_ratio: 0.7
  methods:
    - "whitespace"
    - "truncate"

circuit_breaker:
  enabled: true
  max_failures: 5
  timeout: 30s
  half_open_requests: 3

auth:
  enabled: true
  # Clave "open" siempre válida (backward compatibility)
  open_key: "open"
  # Rate limit para clave "open" por IP
  open_key_rate_limit:
    enabled: true
    requests_per_minute: 60
  # Otras claves válidas (se validan contra esta lista)
  valid_keys:
    - "open"
    # - "tu-clave-secreta-aqui"
  # Rate limit general para claves válidas
  rate_limit:
    enabled: true
    requests_per_minute: 1000

rate_limit:
  enabled: true
  requests_per_minute: 1000

mtls:
  enabled: false
  # CA certificate for verifying client certificates
  ca_cert: ""
  # Server certificate and key (for TLS)
  server_cert: ""
  server_key: ""
  # Require client certificate for all connections
  require_client_cert: false

semantic_cache:
  enabled: true
  model: "sentence-transformers/all-MiniLM-L6-v2"
  threshold: 0.95
  max_entries: 500